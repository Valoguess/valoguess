services:
  valoguess_nextjs:
    image: ghcr.io/valoguess/valoguess:latest
    restart: always
    ports:
      - 4000:4000
    env_file:
      - .env
    networks:
      - valoguess
  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    volumes:
      - data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - valoguess

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - valoguess

volumes:
  data:

networks:
  valoguess:
    external: true