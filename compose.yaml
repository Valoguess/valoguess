services:
  valoguess:
    image: ghcr.io/valoguess/valoguess:latest
    restart: always
    ports:
      - 4000:4000
    env_file:
      - .env
    networks:
      - valoguess

  postgres:
    image: postgres
    restart: always
    shm_size: 128mb
    volumes:
      - data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - valoguess

volumes:
  data:

networks:
  valoguess:
    external: true